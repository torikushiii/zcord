[package]
name = "zcord"
version = "0.3.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[dependencies]
gpui = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_tokio = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
gpui-component = { git = "https://github.com/zeronsh/gpui-component", rev = "701ca97af7983bf85343d2d1d404ab528b18ec96" }
gpui-base = { git = "https://github.com/zeronsh/gpui-component", rev = "701ca97af7983bf85343d2d1d404ab528b18ec96" }
gpui-component-assets = { git = "https://github.com/zeronsh/gpui-component", rev = "701ca97af7983bf85343d2d1d404ab528b18ec96" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "cookies", "stream"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
base64 = "0.22"
chrono = "0.4"
iana-time-zone = "0.1"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
rand = "0.8"
dirs = "6"
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
# Composites APNG frames itself; see `media::animated::apng`. Kept on the version `image` uses.
png = "=0.18.1"
palette = { version = "0.7", default-features = false, features = ["std"] }
color-thief = "0.2.2"
unicode-segmentation = "1"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }
davey = "=0.1.5"
opus = "0.4"
cpal = "0.18"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
nnnoiseless = { version = "0.5", default-features = false }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
windows-core = "0.62.2"
tauri-winrt-notification = "0.8"
# Only the Windows tray is used; the default libappindicator feature pulls in gtk3 for Linux.
tray-icon = { version = "0.26.1", default-features = false }
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
strip = "symbols"

# Slower to build; used for installers and published builds.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54", features = ["test-support"] }

[patch.crates-io]
# The unused HPKE libcrux backend pins a vulnerable AEAD dependency in 0.6.1.
# Keep the upstream fix pinned until OpenMLS supports a fixed registry release.
hpke-rs-libcrux = { git = "https://github.com/celabshq/hpke-rs", rev = "654df20e5c2e6657f0ac17f2a903f179bb97a5ae" }
# image-webp 0.2.4 omits the transparent-frame disposal fix from PR #171.
# Keep the decoder pinned to the upstream fix until it reaches a registry release.
image-webp = { git = "https://github.com/image-rs/image-webp", rev = "5139e991e5f8d54ac3635cfc988ebb41d5fd4b3f" }
