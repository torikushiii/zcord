name: release

# Publish by pushing a tag `v<version>` that matches Cargo.toml.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Package installer and portable zip
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x86_64
          path: |
            target/package/*.zip
            target/package/*-setup.exe
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 14 }}

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Version guard (tag == Cargo.toml version)
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ls dist/
          for artifact in windows-x86_64.zip windows-x86_64-setup.exe; do
            test -f "dist/zcord-$ver-$artifact" \
              || { echo "missing zcord-$ver-$artifact: does Cargo.toml say $ver?"; exit 1; }
          done
      - name: Release notes (CHANGELOG.md section)
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v heading="## $ver" '$0 == heading { found = 1; next } /^## / { found = 0 } found && NF' \
            CHANGELOG.md > release-notes.md
          test -s release-notes.md \
            || { echo "CHANGELOG.md has no entries under '## $ver'"; exit 1; }
          cat release-notes.md
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          body_path: release-notes.md
