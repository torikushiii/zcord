[package]
name = "zcord-discord"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
description = "Discord's gateway, REST API, models and voice for zcord, without any UI"

[features]
# Protobuf builders the app's store tests use to fake settings payloads.
test-fixtures = []

[dependencies]
zcord-convert = { path = "../convert" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "cookies", "stream"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
base64 = "0.22"
chrono = "0.4"
iana-time-zone = "0.1"
log = "0.4"
rand = "0.8"
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }
davey = "=0.1.5"
opus = "0.4"
cpal = "0.18"
nnnoiseless = { version = "0.5", default-features = false }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
] }
